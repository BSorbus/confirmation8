# Ustawienia aplikacji niezależne od serwera. Adres, użytkownik i hasło API NETPAR oraz search_url
# są wyłącznie w credentials (lub zmiennych środowiskowych) – patrz config/initializers/confirmation.rb.
shared:
  netpar:
    open_timeout: 5
    read_timeout: 10
  # Kategorie widoczne w formularzu (kody jak w NETPAR: M, L, R). Kategorie L i R wymagają
  # w NETPAR endpointu certificates/search_by_multi_params – do tego czasu można je wyłączyć
  # zmienną CONFIRMATION_CATEGORIES=M.
  categories: <%= ENV.fetch("CONFIRMATION_CATEGORIES", "M,L,R").split(",").map(&:strip) %>
  matomo:
    enabled: false
    url: https://stats.uke.gov.pl/
    site_id: 6

# Testy nie łączą się z prawdziwym NETPAR (WebMock) – sztuczne adresy zamiast credentials.
test:
  netpar:
    url: https://netpar.test/api/v1
    user: confirmation
  search_url: https://confirmation.test/certificates/new

production:
  # Na serwerze testowym wyłączane w credentials (matomo.enabled: false) – patrz initializer.
  matomo:
    enabled: true
