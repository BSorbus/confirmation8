# Ustawienia aplikacji niezależne od serwera. Adres, użytkownik i hasło API NETPAR oraz search_url
# są wyłącznie w credentials (lub zmiennych środowiskowych) – patrz config/initializers/confirmation.rb.
shared:
  netpar:
    open_timeout: 5
    read_timeout: 10
  # Kategorie (zakładki), które pokazujemy użytkownikom – kody jak w NETPAR: M, L, R.
  # Rodzaje świadectw w każdej zakładce ustala NETPAR (divisions.enabled_in_confirmation) – gdy w danej
  # kategorii żaden nie jest zaznaczony, lista rodzajów jest pusta. Na serwerze można nadpisać zmienną
  # CONFIRMATION_CATEGORIES, np. "M".
  categories: <%= ENV.fetch("CONFIRMATION_CATEGORIES", "M,L,R").split(",").map(&:strip) %>
  matomo:
    enabled: false
    url: https://stats.uke.gov.pl/
    site_id: 6

# Testy nie łączą się z prawdziwym NETPAR (WebMock) – sztuczne adresy zamiast credentials.
test:
  netpar:
    url: https://netpar.test/api/v1
    user: confirmation
  search_url: https://confirmation.test/certificates/new
  # Testy obejmują wszystkie kategorie – niezależnie od domyślnej wartości dla serwerów.
  categories: [M, L, R]

production:
  # Na serwerach domyślnie bez radioamatorskich (R) – do decyzji urzędu (dotyczy też serwera testowego).
  categories: <%= ENV.fetch("CONFIRMATION_CATEGORIES", "M,L").split(",").map(&:strip) %>
  # Na serwerze testowym wyłączane w credentials (matomo.enabled: false) – patrz initializer.
  matomo:
    enabled: true
