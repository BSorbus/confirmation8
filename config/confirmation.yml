# Ustawienia aplikacji niezależne od serwera. Adres, użytkownik i hasło API NETPAR są wyłącznie w credentials
# (lub zmiennych środowiskowych) – patrz config/initializers/confirmation.rb. Adres w kodzie QR zaświadczenia
# podaje NETPAR (verification_url; ustawienie confirmation_search_url w secrets.yml NETPAR).
shared:
  netpar:
    open_timeout: 5
    read_timeout: 10
  # Kategorie (zakładki), które pokazujemy użytkownikom – kody jak w NETPAR: M, L, R.
  # Rodzaje świadectw w każdej zakładce ustala NETPAR (divisions.enabled_in_confirmation) – gdy w danej
  # kategorii żaden nie jest zaznaczony, lista rodzajów jest pusta. Serwer może pokazać mniej zakładek:
  # `categories: [M, L]` w credentials albo zmienna CONFIRMATION_CATEGORIES="M,L" – patrz initializer.
  categories: [M, L, R]
  matomo:
    enabled: false
    url: https://stats.uke.gov.pl/
    site_id: 6

# Testy nie łączą się z prawdziwym NETPAR (WebMock) – sztuczne adresy zamiast credentials.
test:
  netpar:
    url: https://netpar.test/api/v1
    user: confirmation

production:
  # Na serwerze testowym wyłączane w credentials (matomo.enabled: false) – patrz initializer.
  matomo:
    enabled: true
