  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "– to pole jest wymagane"
      inclusion: "nie znajduje się na liście dopuszczalnych wartości"
      invalid_date: "nie jest poprawną datą"
      number_exact_digits: "musi mieć dokładnie %{min} cyfr"
      number_digits_range: "musi mieć od %{min} do %{max} cyfr"
      # Komunikaty neutralne gramatycznie – pasują do nazw pól w każdym rodzaju i liczbie
      # („Numer…”, „Data…”, „Imiona…”).
      too_long:
        one: "– maksymalnie %{count} znak"
        few: "– maksymalnie %{count} znaki"
        many: "– maksymalnie %{count} znaków"
        other: "– maksymalnie %{count} znaków"

  helpers:
